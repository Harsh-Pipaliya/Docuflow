name: docuflow
x-app: &app
  image: docuflow-app:local
  build: .
  environment: &env
    EMULATOR_URL: http://cloud:4588
    FIRESTORE_EMULATOR_HOST: cloud:4588
services:
  cloud:
    image: floci/floci-gcp@sha256:a59403d43d524b1a08282d67d541a6d37bf7868cbd9d1311caa0d2983adf6f46
    environment:
      FLOCI_GCP_SERVICES_IAM_AUTHORIZATION_MODE: enforce
      FLOCI_GCP_SERVICES_IAM_BOOTSTRAP_ADMIN_MEMBER: serviceAccount:api@docuflow.iam.gserviceaccount.com
  bootstrap:
    <<: *app
    depends_on: [cloud, processor]
    command: ["python","-m","infra.bootstrap"]
    restart: on-failure:5
  processor:
    <<: *app
    environment:
      <<: *env
      COMPONENT: processor
      FORCE_FAILURE_FILE_ID: ${FORCE_FAILURE_FILE_ID:-}
    command: ["gunicorn","--bind","0.0.0.0:8080","--timeout","90","processor.app:create_app()"]
  api:
    <<: *app
    env_file: .env
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    ports: ["127.0.0.1:8080:8080"]
    command: ["gunicorn","--bind","0.0.0.0:8080","--threads","4","backend.app:create_app()"]
